<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0; url=https://mces-six.vercel.app">
  <link rel="canonical" href="https://mces-six.vercel.app">
  <title>Redirecting to MCES Lab...</title>
  <script>
    window.location.replace("https://mces-six.vercel.app");
  </script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #0d1117;
      color: #e6edf3;
      padding: 1.5rem;
      text-align: center;
    }
    .container {
      background: #161b22;
      border: 1px solid #30363d;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
      max-width: 440px;
      width: 100%;
    }
    .spinner {
      width: 42px;
      height: 42px;
      margin: 0 auto 1.5rem;
      border: 4px solid #30363d;
      border-top: 4px solid #58a6ff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h1 {
      font-size: 1.3rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
      color: #f0f6fc;
    }
    p {
      font-size: 0.95rem;
      color: #8b949e;
      margin-bottom: 1.25rem;
      line-height: 1.5;
    }
    a {
      display: inline-block;
      color: #58a6ff;
      text-decoration: none;
      font-weight: 500;
      word-break: break-all;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h1>Redirecting to MCES Lab...</h1>
    <p>You are being redirected to<br><strong>mces-six.vercel.app</strong></p>
    <p>If you are not redirected automatically,<br><a href="https://mces-six.vercel.app">click here to continue</a>.</p>
  </div>
</body>
</html>
